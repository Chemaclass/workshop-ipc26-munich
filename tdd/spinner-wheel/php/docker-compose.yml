services:
  spinner-wheel-tdd:
    build: .
    container_name: ipc26-spinner-wheel-php
    command: sh -c "composer install --no-interaction && tail -f /dev/null"
    working_dir: /srv/workshop-ipc26-munich/tdd/spinner-wheel/php
    ports:
      - "8000:8000"
    volumes:
      - .:/srv/workshop-ipc26-munich/tdd/spinner-wheel/php:delegated
    environment:
      XDEBUG_MODE: debug
      XDEBUG_SESSION: PHPSTORM
