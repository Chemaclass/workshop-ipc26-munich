# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/v0.88.0/docs/schemas/config.schema.json
version: 1
requires: ">=0.88.0"
builtins: []

# Default tools. Pick your own in agnostic-ai.local.yaml (git-ignored), for example: targets: [gemini]
targets:
  - claude
  - grok

# Set to error to fail sync when a target cannot represent a spec.
on-unsupported: warn
