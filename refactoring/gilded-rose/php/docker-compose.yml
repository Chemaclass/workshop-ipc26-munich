services:
  gilded-rose-refactoring:
    build: .
    container_name: ipc26-gilded-rose-php
    command: sh -c "composer install --no-interaction && tail -f /dev/null"
    volumes:
      - .:/srv/workshop-ipc26-munich/refactoring/gilded-rose/php:delegated
    environment:
      XDEBUG_MODE: debug
      XDEBUG_SESSION: PHPSTORM
